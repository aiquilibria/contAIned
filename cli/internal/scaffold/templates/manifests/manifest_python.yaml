# contAIned repo manifest — Python ecosystem
#
# Commit this file to .contAIned_manifest.yaml in your repository root.
# Only ecosystems and runtime.qa.checks are permitted here; all other settings
# (network, sigstore, plugins, etc.) are owned by the operator manifest.
#
# Python is pre-installed in the base image — no version pin is needed.
# Declaring the ecosystem tells `contained init` to add pypi.org and
# files.pythonhosted.org to the network allowlist automatically.

ecosystems:
  python:
    version: "3.13.4"   # annotate your project's Python version; no toolchain install

runtime:
  qa:
    checks:
      - name: lint
        command: [ruff, check, .]
        when_changed: ["*.py"]
      - name: format
        command: [ruff, format, --check, .]
        when_changed: ["*.py"]
      - name: types
        command: [pyright]
        when_changed: ["*.py"]
      - name: tests
        command: [pytest, tests/, -x, --tb=short, -q]
        when_changed: ["*.py"]
