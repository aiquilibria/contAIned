# contAIned repo manifest — TypeScript ecosystem
#
# Commit this file to .contAIned_manifest.yaml in your repository root.
# Only ecosystems and runtime.qa.checks are permitted here; all other settings
# (network, sigstore, plugins, etc.) are owned by the operator manifest.
#
# `contained init` resolves the typescript ecosystem against the operator manifest's
# ecosystems map (which maps it to the node toolchain), installs Node.js at
# the pinned version, and adds registry.npmjs.org to the network allowlist.

ecosystems:
  typescript:
    version: "20"   # pin your project's Node.js major version here

runtime:
  qa:
    checks:
      - name: typecheck
        command: [npx, tsc, --noEmit]
        when_changed: ["*.ts", "*.tsx"]
      - name: lint
        command: [npx, eslint, .]
        when_changed: ["*.ts", "*.tsx", "*.js"]
      - name: test
        command: [npm, test]
        when_changed: ["*.ts", "*.tsx", "*.js"]
