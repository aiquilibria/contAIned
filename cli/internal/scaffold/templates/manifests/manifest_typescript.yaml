# contAIned repo manifest — TypeScript ecosystem
#
# Commit this file to .contAIned_manifest.yaml in your repository root.
# Only ecosystems and policy.qa.checks are permitted here; all policy settings
# (network, secrets, bash rules, sigstore, etc.) are owned by the operator manifest.
#
# `contained init` resolves the typescript ecosystem against the operator manifest's
# ecosystem_definitions (which maps it to the node toolchain), installs Node.js at
# the pinned version, and adds registry.npmjs.org to the network allowlist.

# To pre-install plugins in your operator manifest, use one of two mechanisms:
#
#   # Ecosystem-scoped: installed only when this ecosystem is active in a repo.
#   ecosystem_definitions:
#     typescript:
#       plugins:
#         - marketplace: claude-plugins-official
#           plugin: typescript-lsp
#
#   # Global: always installed regardless of ecosystem (e.g. a GitHub integration).
#   policy:
#     plugins:
#       preinstall:
#         - marketplace: claude-plugins-official
#           plugin: github
#
# See docs/policy-reference.md for full plugin policy options.

ecosystems:
  typescript: "20"   # pin your project's Node.js major version here

policy:
  qa:
    checks:
      - name: typecheck
        command: [npx, tsc, --noEmit]
        when_changed: ["*.ts", "*.tsx"]
      - name: lint
        command: [npx, eslint, .]
        when_changed: ["*.ts", "*.tsx", "*.js"]
      - name: test
        command: [npm, test]
        when_changed: ["*.ts", "*.tsx", "*.js"]
