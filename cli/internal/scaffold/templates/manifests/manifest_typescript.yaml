# contAIned repo manifest — TypeScript ecosystem
#
# Commit this file to .contAIned_manifest.yaml in your repository root.
# Only runtime.docker.toolchains and policy.qa.checks are permitted here;
# all policy settings are owned by the mAInlined manifest.
#
# `contained init` merges this file on top of the mAInlined manifest at
# image build time. Any change here triggers an image rebuild.

runtime:
  docker:
    toolchains:
      node: "20"   # TypeScript runs on Node.js — pin your project's major version here

policy:
  qa:
    checks:
      - name: typecheck
        command: [npx, tsc, --noEmit]
        when_changed: ["*.ts", "*.tsx"]
      - name: lint
        command: [npx, eslint, .]
        when_changed: ["*.ts", "*.tsx", "*.js"]
      - name: test
        command: [npm, test]
        when_changed: ["*.ts", "*.tsx", "*.js"]
