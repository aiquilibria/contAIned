# contAIned repo manifest — Node.js ecosystem
#
# Commit this file to .contAIned_manifest.yaml in your repository root.
# Only ecosystems and runtime.qa.checks are permitted here; all other settings
# (network, sigstore, plugins, etc.) are owned by the operator manifest.
#
# `contained init` resolves the node ecosystem against the operator manifest's
# ecosystems map, installs Node.js at the pinned version, and adds
# registry.npmjs.org to the network allowlist automatically.

ecosystems:
  node:
    version: "20"   # pin your project's Node.js major version here

runtime:
  qa:
    checks:
      - name: test
        command: [npm, test]
        when_changed: ["*.js", "*.ts", "*.mjs", "*.cjs"]
