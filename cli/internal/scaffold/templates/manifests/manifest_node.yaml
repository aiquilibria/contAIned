# contAIned repo manifest — Node.js ecosystem
#
# Commit this file to .contAIned_manifest.yaml in your repository root.
# Only ecosystems and policy.qa.checks are permitted here; all policy settings
# (network, secrets, bash rules, sigstore, etc.) are owned by the operator manifest.
#
# `contained init` resolves the node ecosystem against the operator manifest's
# ecosystem_definitions, installs Node.js at the pinned version, and adds
# registry.npmjs.org to the network allowlist automatically.

ecosystems:
  node: "20"   # pin your project's Node.js major version here

policy:
  qa:
    checks:
      - name: test
        command: [npm, test]
        when_changed: ["*.js", "*.ts", "*.mjs", "*.cjs"]
