# contAIned repo manifest — Go ecosystem
#
# Commit this file to .contAIned_manifest.yaml in your repository root.
# Only ecosystems and runtime.qa.checks are permitted here; all other settings
# (network, sigstore, plugins, etc.) are owned by the operator manifest.
#
# `contained init` resolves the ecosystem declaration against the operator
# manifest's ecosystems map, installs the Go toolchain at the pinned version,
# and adds the required network domains (proxy.golang.org, sum.golang.org)
# to the allowlist automatically.

ecosystems:
  go:
    version: "1.24.0"   # pin your project's Go version here

runtime:
  qa:
    checks:
      - name: test
        command: [go, test, ./...]
        when_changed: ["*.go"]
      - name: vet
        command: [go, vet, ./...]
        when_changed: ["*.go"]
