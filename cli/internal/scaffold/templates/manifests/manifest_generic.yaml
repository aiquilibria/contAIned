# contAIned policy manifest — v3 schema
#
# Three top-level sections by lifecycle phase:
#   ecosystems — operator-defined runtime definitions; repos opt in by name + version.
#   init       — build-time config baked into the Docker image at `contained init`.
#   runtime    — per-tool-call enforcement rules evaluated by hooks.
#
# Run `contained init --manifest <this-file>` to build the image.

# ── Ecosystem definitions ──────────────────────────────────────────────────────
# Maps ecosystem names (declared by repos in .contAIned_manifest.yaml) to the
# toolchain they install, network domains they require, and optional plugins.
# Repos opt in with: ecosystems:\n  go:\n    version: "1.25.7"
ecosystems:
  go:
    version: ">=1.23"      # floor constraint; repo must satisfy
    toolchain: go
    deps: []               # e.g. [golangci-lint]
    network_domains:
      - proxy.golang.org
      - sum.golang.org
    env:
      # Redirect the Go build cache to a sandbox-writable path.
      GOCACHE: /tmp/claude/go-build
    # plugins:
    #   - marketplace: claude-plugins-official
    #     plugin: go-lsp
  python:
    # Python is pre-installed in the base image; no toolchain key needed.
    network_domains:
      - pypi.org
      - files.pythonhosted.org
    # plugins:
    #   - marketplace: claude-plugins-official
    #     plugin: python-lsp
  node:
    toolchain: node
    network_domains:
      - registry.npmjs.org
  typescript:
    toolchain: node   # TypeScript runs on Node.js
    network_domains:
      - registry.npmjs.org
  ruby:
    toolchain: ruby
    network_domains:
      - rubygems.org
      - api.rubygems.org
  java:
    toolchain: java
    network_domains:
      - repo1.maven.org
      - search.maven.org

# ── Init (build-time) ──────────────────────────────────────────────────────────
init:
  container:
    image: contained:latest
    memory: 2g
    cpus: 2
    network: contAIned-net
    agent_config_volume: contAIned-agent-config
    # extra_mounts: []       # e.g. ["~/.ssh:/home/agent/.ssh:ro"]
    # extra_secrets: []      # bind-mounted secrets; see docs/policy-reference.md

  agent:
    model: claude-sonnet-4-6
    budget_tokens: 1024

  sigstore:
    enabled: false
    rekor_url: https://rekor.sigstore.dev
    fulcio_url: https://fulcio.sigstore.dev

  plugins:
    # strict_marketplaces: true
    builtin_marketplace: true
    # extra_marketplaces:
    #   - source: github
    #     repo: your-org/plugins
    #     ref: main
    # preinstall:
    #   - marketplace: claude-plugins-official
    #     plugin: github

  mcp:
    approved_servers: []

  skills:
    approved_skills: []

  mainlined:
    url: ""          # e.g. https://mainlined.example.com
    policy_name: ""
    policy_ref: ""
    policy_version: ""

  sandbox:
    enabled: true
    filesystem:
      denyWrite:
        - .contAIned

# ── Runtime (hook enforcement) ─────────────────────────────────────────────────
runtime:
  network:
    enabled: true
    allowed_domains:
      - api.anthropic.com
      - code.claude.com
      - docs.anthropic.com
      - github.com
      - ssh.github.com

  # Cedar-inspired unified rules. See docs/policy-reference.md for full syntax.
  rules:
    - id: v1:define:secret-file-patterns
      effect: define
      resource_type: FilePath
      define:
        is_secret:
          patterns:
            - '(^|[/\\])\\.env(\.[^/\\]+)?$'
            - '\\.(pem|key|p12|pfx|jks|keystore)$'
            - '(^|[/\\])id_(rsa|dsa|ecdsa|ed25519)$'
            - '(^|[/\\])(credentials|secrets|service_account)\\.(json|yaml|yml)$'
        is_safe_variant:
          patterns:
            - '\\.(example|sample|template)$'
      tags: [secrets]

    - id: v1:secrets:allow-safe-variants
      effect: permit
      action: ["Read", "Write", "Edit", "MultiEdit", "Glob", "Grep"]
      resource_type: FilePath
      when: ["resource.is_safe_variant == true"]
      tags: [secrets]

    - id: v1:secrets:block
      effect: forbid
      action: ["Read", "Write", "Edit", "MultiEdit", "Glob", "Grep"]
      resource_type: FilePath
      when: ["resource.is_secret == true"]
      unless: ["resource.is_safe_variant == true"]
      reason: "Secret files (credentials, keys, .env) may not be accessed."
      tags: [secrets]

  qa:
    checks: []
    # Example:
    # checks:
    #   - name: lint
    #     command: [ruff, check, .]
    #     when_changed: ["*.py"]
