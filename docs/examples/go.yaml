# contAIned repo manifest — Go project
#
# Commit this file to .contAIned_manifest.yaml in your repository root.
# Only ecosystems and policy.qa.checks are permitted here;
# all policy settings (network, secrets, bash rules, sigstore, etc.) are
# owned by the mAInlined manifest.
#
# Declaring the go ecosystem tells `contained init` to install the Go toolchain
# at the specified version and add proxy.golang.org + sum.golang.org to the
# network allowlist automatically (via ecosystem_definitions in the operator manifest).

ecosystems:
  go: "1.22.5"   # pin your project's Go version here

policy:
  qa:
    checks:
      - name: go-build
        command: [go, build, ./...]
        when_changed: ["*.go"]

      - name: go-fmt
        command: [sh, -c, 'test -z "$(gofmt -l .)"']
        when_changed: ["*.go"]

      - name: go-vet
        command: [go, vet, ./...]
        when_changed: ["*.go"]

      - name: go-test
        command: [go, test, ./..., -count=1, -timeout=120s]
        when_changed: ["*.go"]
