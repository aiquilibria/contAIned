# contAIned repo manifest — Go project
#
# Commit this file to .contAIned_manifest.yaml in your repository root.
# Only runtime.docker.toolchains and policy.qa.checks are permitted here;
# all policy settings (secrets, bash rules, network, sigstore, etc.) are
# owned by the mAInlined manifest.
#
# `contained init` merges this file on top of the mAInlined manifest at
# image build time. Any change here triggers an image rebuild.

runtime:
  docker:
    toolchains:
      go: "1.22.5"   # pin your project's Go version here

policy:
  qa:
    checks:
      - name: go-vet
        command: [go, vet, ./...]
        when_changed: ["*.go"]

      - name: go-test
        command: [go, test, ./..., -count=1, -timeout=120s]
        when_changed: ["*.go"]
