# contAIned repo manifest — Python + TypeScript monorepo
#
# Commit this file to .contAIned_manifest.yaml in your repository root.
# Only runtime.docker.toolchains and policy.qa.checks are permitted here;
# all policy settings (secrets, bash rules, network, sigstore, etc.) are
# owned by the mAInlined manifest.
#
# Each check is gated on the relevant file extensions so only affected
# checks run when a specific layer is touched.
#
# `contained init` merges this file on top of the mAInlined manifest at
# image build time. Any change here triggers an image rebuild.

runtime:
  docker:
    toolchains:
      node: "20"   # Python is pre-installed; add python: "3.12" to pin

policy:
  qa:
    checks:
      # ── Python layer ──────────────────────────────────────────────────────────
      - name: py-lint
        command: [ruff, check, .]
        when_changed: ["*.py"]

      - name: py-format
        command: [ruff, format, --check, .]
        when_changed: ["*.py"]

      - name: py-types
        command: [pyright]
        when_changed: ["*.py"]

      - name: py-tests
        command: [pytest, tests/, -x, --tb=short, -q]
        when_changed: ["*.py"]

      # ── TypeScript layer ──────────────────────────────────────────────────────
      - name: ts-build
        command: [npx, tsc, --noEmit]
        when_changed: ["*.ts", "*.tsx"]

      - name: ts-lint
        command: [npx, eslint, src/, --max-warnings=0]
        when_changed: ["*.ts", "*.tsx", "*.js"]

      - name: ts-tests
        command: [npx, vitest, run, --reporter=verbose]
        when_changed: ["*.ts", "*.tsx"]
