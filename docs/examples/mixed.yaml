# contAIned repo manifest — Python + TypeScript monorepo
#
# Commit this file to .contAIned_manifest.yaml in your repository root.
# Only ecosystems and policy.qa.checks are permitted here;
# all policy settings (network, secrets, bash rules, sigstore, etc.) are
# owned by the mAInlined manifest.
#
# Each ecosystem declaration is resolved by `contained init` against the
# operator manifest's ecosystem_definitions: Node.js is installed for
# typescript; pypi.org/files.pythonhosted.org and registry.npmjs.org are
# added to the network allowlist. Each QA check is gated on the relevant
# file extensions so only affected checks run when a specific layer is touched.

ecosystems:
  python: ""      # pre-installed
  typescript: "20"

policy:
  qa:
    checks:
      # ── Python layer ──────────────────────────────────────────────────────────
      - name: py-lint
        command: [ruff, check, .]
        when_changed: ["*.py"]

      - name: py-format
        command: [ruff, format, --check, .]
        when_changed: ["*.py"]

      - name: py-types
        command: [pyright]
        when_changed: ["*.py"]

      - name: py-tests
        command: [pytest, tests/, -x, --tb=short, -q]
        when_changed: ["*.py"]

      # ── TypeScript layer ──────────────────────────────────────────────────────
      - name: ts-build
        command: [npx, tsc, --noEmit]
        when_changed: ["*.ts", "*.tsx"]

      - name: ts-lint
        command: [npx, eslint, src/, --max-warnings=0]
        when_changed: ["*.ts", "*.tsx", "*.js"]

      - name: ts-tests
        command: [npx, vitest, run, --reporter=verbose]
        when_changed: ["*.ts", "*.tsx"]
