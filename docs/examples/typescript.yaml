# contAIned repo manifest — TypeScript / Node.js project
#
# Commit this file to .contAIned_manifest.yaml in your repository root.
# Only ecosystems and policy.qa.checks are permitted here;
# all policy settings (network, secrets, bash rules, sigstore, etc.) are
# owned by the mAInlined manifest.
#
# Declaring the typescript ecosystem tells `contained init` to install Node.js
# at the specified version and add registry.npmjs.org to the network allowlist
# automatically (typescript maps to the node toolchain in ecosystem_definitions).

ecosystems:
  typescript: "20"   # pin your project's Node.js major version here

policy:
  qa:
    checks:
      - name: ts-build
        command: [npx, tsc, --noEmit]
        when_changed: ["*.ts", "*.tsx"]

      - name: lint
        command: [npx, eslint, src/, --max-warnings=0]
        when_changed: ["*.ts", "*.tsx", "*.js"]

      # Replace "vitest" with "jest" if your project uses jest
      - name: tests
        command: [npx, vitest, run, --reporter=verbose]
        when_changed: ["*.ts", "*.tsx"]
