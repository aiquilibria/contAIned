# contAIned mAInlined manifest — example
#
# This is the manifest enforced by the mAInlined operator. It controls all
# policy settings: container resources, model selection, security rules,
# network policy, audit logging, sigstore provenance, toolchain floor
# constraints, and ecosystem definitions. Repositories cannot override these
# settings — they can only declare ecosystems (resolved against the definitions
# below) and QA checks via their own .contAIned_manifest.yaml.
#
# Deploy this via:
#   contained init --mainlined https://mainlined.example.com
# or:
#   contained init --manifest docs/examples/mainlined.yaml
#
# See docs/policy-reference.md for full schema documentation.

# ── Ecosystem definitions ─────────────────────────────────────────────────────
# Maps ecosystem names (declared by repos in .contAIned_manifest.yaml) to the
# toolchain they install and the network domains they require. Operators may
# customise these entries — for example, pointing python's network_domains at
# an internal PyPI mirror instead of pypi.org.
ecosystem_definitions:
  go:
    toolchain: go
    network_domains:
      - proxy.golang.org
      - sum.golang.org
    env:
      GOCACHE: /tmp/claude/go-build
      GOPATH: /tmp/claude/gopath
  python:
    # Python is pre-installed in the base image; no toolchain key needed.
    network_domains:
      - pypi.org
      - files.pythonhosted.org
  node:
    toolchain: node
    network_domains:
      - registry.npmjs.org
  typescript:
    toolchain: node   # TypeScript runs on Node.js
    network_domains:
      - registry.npmjs.org
  ruby:
    toolchain: ruby
    network_domains:
      - rubygems.org
      - api.rubygems.org
  java:
    toolchain: java
    network_domains:
      - repo1.maven.org
      - search.maven.org

# ── Runtime ───────────────────────────────────────────────────────────────────
runtime:
  docker:
    image: contained:latest
    memory: 2g
    cpus: 2
    network: contAIned-net
    agent_config_volume: contAIned-agent-config
    # Toolchain floor constraints: repos may pin any version satisfying these.
    toolchains:
      go: ">=1.22"
      node: ">=18"
  mAInlined:
    url: "https://mainlined.example.com"

# ── Agent ─────────────────────────────────────────────────────────────────────
agent:
  model: claude-sonnet-4-6
  budget_tokens: 1024

policy:

  # ── Sigstore provenance ──────────────────────────────────────────────────────
  sigstore:
    enabled: true
    rekor_url: https://rekor.sigstore.dev
    fulcio_url: https://fulcio.sigstore.dev

  # ── Secret-file protection ──────────────────────────────────────────────────
  secrets:
    rules:
      - name: safe-variants
        patterns: ['\.(example|sample|template)']
        action: allow
      - name: dotenv
        patterns: ['(^|[/\\])\.env(\.[^/\\]+)?$']
        reason: "Secret files (credentials, keys, .env) may not be accessed."
        action: block
      - name: keys
        patterns: ['\.(pem|key|p12|pfx|jks|keystore)$']
        reason: "Secret files (credentials, keys, .env) may not be accessed."
        action: block
      - name: ssh-keys
        patterns: ['(^|[/\\])id_(rsa|dsa|ecdsa|ed25519)$']
        reason: "Secret files (credentials, keys, .env) may not be accessed."
        action: block
      - name: credential-files
        patterns: ['(^|[/\\])(credentials|secrets|service_account)\.(json|yaml|yml)$']
        reason: "Secret files (credentials, keys, .env) may not be accessed."
        action: block
      - name: secret-extension
        patterns: ['\.(secret|secrets)$']
        reason: "Secret files (credentials, keys, .env) may not be accessed."
        action: block

  # ── Bash command restrictions ────────────────────────────────────────────────
  bash:
    rules:
      - name: safe-git-reads
        patterns:
          - '^git\s+status\b'
          - '^git\s+log\b'
          - '^git\s+diff\b'
          - '^git\s+show\b'
          - '^git\s+branch\b'
          - '^git\s+stash\s+list\b'
          - '^git\s+remote\b'
        action: allow
      - name: safe-read-only
        patterns: ['^ls\b', '^pwd\b', '^echo\s', '^which\s', '^grep\b', '^rg\b', '^find\b', '^cat\b', '^wc\b']
        action: allow
      - name: destructive
        patterns: ['^rm\s', '.*\brm\s+-rf\b.*']
        reason: "Destructive file deletion is not permitted."
        action: block
      - name: privilege_escalation
        patterns: ['^sudo\s']
        reason: "Privilege escalation is not permitted."
        action: block
      - name: network_exfiltration
        patterns: ['^(curl|wget|nc|ncat)\s']
        reason: "Outbound network calls from Bash are not permitted."
        action: block
      - name: package_publish
        patterns: ['^(npm\s+publish|pip\s+upload|twine\s+upload)\b']
        reason: "Package publishing requires explicit operator approval."
        action: block

  # ── Network policy ────────────────────────────────────────────────────────────
  # Anthropic infrastructure is required for all sessions. Package registry
  # domains for declared ecosystems are added automatically at `contained init`
  # time from ecosystem_definitions above — no manual entries needed here.
  # Add project-specific external APIs below as required.
  network:
    enabled: true
    allowed_domains:
      - api.anthropic.com
      - code.claude.com
      - docs.anthropic.com

  # ── Audit logging ─────────────────────────────────────────────────────────────
  audit:
    enabled: true

  # ── QA gate ───────────────────────────────────────────────────────────────────
  # Leave empty here — repositories define their own QA checks via
  # .contAIned_manifest.yaml. The mAInlined manifest may add shared checks
  # that run in addition to the repo's checks.
  qa:
    checks: []

  # ── MCP server approvals ──────────────────────────────────────────────────────
  mcp:
    approved_servers: []

  # ── Skill approvals ───────────────────────────────────────────────────────────
  skills:
    approved_skills: []

  # ── mAInlined policy coordination ─────────────────────────────────────────────
  mAInlined:
    url: "https://mainlined.example.com"
    policy_name: "default"
    policy_ref: "main"
    policy_version: ""

  # ── Sandbox ───────────────────────────────────────────────────────────────────
  sandbox:
    enabled: true
    filesystem:
      denyWrite:
        - .contAIned
