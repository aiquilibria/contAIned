# contAIned repo manifest — Python project
#
# Commit this file to .contAIned_manifest.yaml in your repository root.
# Only ecosystems and policy.qa.checks are permitted here;
# all policy settings (network, secrets, bash rules, sigstore, etc.) are
# owned by the mAInlined manifest.
#
# Python is pre-installed in the base image — no version pin is required.
# Declaring the python ecosystem tells `contained init` to add pypi.org and
# files.pythonhosted.org to the network allowlist automatically.

ecosystems:
  python: ""   # pre-installed; set e.g. "3.12" as a version annotation if desired

policy:
  qa:
    checks:
      - name: lint
        command: [ruff, check, .]
        when_changed: ["*.py"]

      - name: format
        command: [ruff, format, --check, .]
        when_changed: ["*.py"]

      - name: types
        command: [pyright]
        when_changed: ["*.py"]

      - name: tests
        command: [pytest, tests/, -x, --tb=short, -q]
        when_changed: ["*.py"]

      - name: coverage
        command: [pytest, tests/, --cov, --cov-report=term-missing, --cov-fail-under=80, -q]
        when_changed: ["*.py"]
