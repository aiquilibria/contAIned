# contAIned repo manifest — Python project
#
# Commit this file to .contAIned_manifest.yaml in your repository root.
# Only runtime.docker.toolchains and policy.qa.checks are permitted here;
# all policy settings (secrets, bash rules, network, sigstore, etc.) are
# owned by the mAInlined manifest.
#
# Python is pre-installed in the base image; no toolchain pin is required
# unless you need a specific version.
#
# `contained init` merges this file on top of the mAInlined manifest at
# image build time. Any change here triggers an image rebuild.

runtime:
  docker:
    toolchains: {}   # Python is pre-installed; add e.g. python: "3.12" to pin

policy:
  qa:
    checks:
      - name: lint
        command: [ruff, check, .]
        when_changed: ["*.py"]

      - name: format
        command: [ruff, format, --check, .]
        when_changed: ["*.py"]

      - name: types
        command: [pyright]
        when_changed: ["*.py"]

      - name: tests
        command: [pytest, tests/, -x, --tb=short, -q]
        when_changed: ["*.py"]

      - name: coverage
        command: [pytest, tests/, --cov, --cov-report=term-missing, --cov-fail-under=80, -q]
        when_changed: ["*.py"]
