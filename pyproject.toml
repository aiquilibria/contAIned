[project]
name = "slash"
version = "0.1.0"
description = "A slash coding agent CLI built on the Claude Agent SDK"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk",
    "click>=8.0",
    "prompt-toolkit>=3.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
slash = "slash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slash"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
