[project]
name = "contained"
version = "0.1.0"
description = "A contAIned coding agent CLI — based on Claude Code"
requires-python = ">=3.13"
dependencies = [
    "pyyaml==6.0.3",
    "pydantic==2.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contained"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ""

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".contAIned", ".claude", "cli/internal/scaffold/templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pyright]
pythonVersion = "3.13"
extraPaths = ["/usr/local/lib/python3.13/site-packages"]


[project.optional-dependencies]
dev = [
    "pyright==1.1.408",
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "pytest-benchmark==5.1.0",
    "ruff==0.15.7",
    "hypothesis==6.151.10",
]

[dependency-groups]
dev = [
    "pyright==1.1.408",
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "pytest-benchmark==5.1.0",
    "ruff==0.15.7",
    "hypothesis==6.151.10",
]
