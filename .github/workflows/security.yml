name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC

permissions:
  contents: read
  security-events: write  # upload SARIF to GitHub Security tab

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, python]
        include:
          - language: go
            build-mode: autobuild
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@v5

      - if: matrix.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Use security-and-quality query suite for broader coverage
          queries: security-and-quality

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  govulncheck:
    name: govulncheck (Go SCA)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          work-dir: cli
          output-format: sarif
          output-file: govulncheck.sarif

      - name: Upload govulncheck SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  pip-audit:
    name: pip-audit (Python SCA)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project and pip-audit
        run: pip install . pip-audit

      - name: Run pip-audit
        run: |
          pip-audit \
            --format sarif \
            --output pip-audit.sarif \
            --progress-spinner off
        continue-on-error: true

      - name: Upload pip-audit SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('pip-audit.sarif') != ''
        with:
          sarif_file: pip-audit.sarif
          category: pip-audit
