name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, python]
        include:
          - language: go
            build-mode: autobuild
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@v5

      - if: matrix.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          # Output results to a local SARIF file; no upload to Security tab
          output: codeql-results
          upload: never

      - name: Fail on CodeQL findings
        run: |
          count=$(python3 - <<'EOF'
          import json, glob, sys
          total = 0
          for f in glob.glob("codeql-results/*.sarif"):
              data = json.load(open(f))
              for run in data.get("runs", []):
                  total += len(run.get("results", []))
          print(total)
          EOF
          )
          echo "CodeQL findings: $count"
          [ "$count" -eq 0 ]

  govulncheck:
    name: govulncheck (Go SCA)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          work-dir: cli
          # Default output (text) — non-zero exit on vulnerabilities fails the job

  pip-audit:
    name: pip-audit (Python SCA)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project and pip-audit
        run: pip install . pip-audit

      - name: Run pip-audit
        # Non-zero exit on vulnerabilities fails the job
        run: pip-audit --progress-spinner off
