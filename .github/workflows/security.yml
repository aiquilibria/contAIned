name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (Go SCA)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          work-dir: cli
          # Scans committed deps only; non-zero exit on call-graph-reachable vulns fails the job

  pip-audit:
    name: pip-audit (Python SCA)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pip-tools and pip-audit
        run: pip install pip-tools pip-audit

      - name: Compile project dependencies
        # Generates a pinned requirements file from pyproject.toml so that
        # pip-audit scans only our project's deps, not pip-audit's own deps.
        run: pip-compile pyproject.toml --output-file /tmp/requirements-audit.txt --quiet

      - name: Run pip-audit
        # Non-zero exit on vulnerabilities fails the job
        run: pip-audit -r /tmp/requirements-audit.txt --progress-spinner off
