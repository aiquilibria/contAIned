name: Release CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create GitHub Release + upload assets
  id-token: write   # keyless cosign OIDC signing

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
            ext: .exe

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build binary
        working-directory: cli
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ github.ref_name }}"
          BINARY="contained_${VERSION#v}_${{ matrix.os }}_${{ matrix.arch }}${{ matrix.ext }}"
          go build \
            -ldflags "-s -w -X contained.dev/cli/internal/version.Version=${VERSION#v}" \
            -o "dist/${BINARY}" \
            .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: contained-${{ matrix.os }}-${{ matrix.arch }}
          path: cli/dist/
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: contained-*
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum contained_* > checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign CLI binaries (keyless)
        working-directory: dist
        run: |
          for bin in contained_*; do
            cosign sign-blob \
              --yes \
              --bundle "${bin}.bundle" \
              "${bin}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/contained_*
            dist/checksums.txt
            install.sh
          generate_release_notes: true
          draft: false
