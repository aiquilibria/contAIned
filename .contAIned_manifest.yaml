# contAIned repo manifest
#
# Commit this file to .contAIned_manifest.yaml in your repository root.
# Only ecosystems and policy.qa.checks are permitted here;
# all policy settings are owned by the mAInlined manifest.
#
# `contained init` merges this file on top of the operator manifest at
# image build time. Any change here triggers an image rebuild.

ecosystems:                                                                                        
  go: "1.25.7"   # CLI build and tests
  python: "3.13.4"

policy:
  qa:
    checks:
      - name: lint
        command: [ruff, check, src/, tests/]
        when_changed: ["*.py"]
      - name: format
        command: [ruff, format, --check, src/, tests/]
        when_changed: ["*.py"]
      - name: types
        command: [pyright]
        when_changed: ["*.py"]
      - name: tests
        command: [pytest, tests/, -x, --tb=short, -q]
        when_changed: ["*.py"]
      - name: coverage
        command: [pytest, tests/, --cov, --cov-report=term-missing, --cov-fail-under=80, -q]
        when_changed: ["*.py"]
      - name: go-build
        command: [sh, -c, "cd cli && go build ./..."]
        when_changed: ["*.go"]
      - name: go-fmt
        command: [sh, -c, 'cd cli && test -z "$(gofmt -l .)"']
        when_changed: ["*.go"]
      - name: go-vet
        command: [sh, -c, "cd cli && go vet ./..."]
        when_changed: ["*.go"]
      - name: go-test
        command: [sh, -c, "cd cli && go test ./..."]
        when_changed: ["*.go"]
